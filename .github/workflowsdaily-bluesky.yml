name: Daily Bluesky Metrics

on:
  schedule:
    # 23:00 UTC = 00:00 UK time during BST
    - cron: "0 23 * * *"

  # Allows you to run it manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::curl
            any::jsonlite
            any::httr2
            any::atrrr
            any::dplyr
            any::readxl
            any::writexl

      - name: Run Bluesky metrics script
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          Rscript github_process.R

      - name: Commit updated CSV
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bluesky_metrics.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily Bluesky metrics"
            git push
          fi
